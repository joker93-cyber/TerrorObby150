name: Build and Deploy TerrorObby150

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required project files
        run: |
          for file in \
            "default.project.json" \
            "ProceduralModels.lua" \
            "LevelGenerator.server.lua" \
            "GameManager.server.lua" \
            "Monetization.server.lua" \
            "HorrorClient.client.lua" \
            "AudioManager.client.lua" \
            "ShopClient.client.lua"; do
            if [ ! -f "$file" ]; then
              echo "Error: Falta el archivo obligatorio $file"
              exit 1
            fi
          done
          echo "Todos los archivos base verificados correctamente."

      - name: Install Rojo
        uses: rojo-rbx/install-rojo@v1
        with:
          version: "7.4.4"

      - name: Build TerrorObby150.rbxl
        run: rojo build default.project.json --output TerrorObby150.rbxl

      - name: Upload built place artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerrorObby150-rbxl
          path: TerrorObby150.rbxl

      - name: Publish to Roblox Open Cloud (Conditional)
        if: env.ROBLOX_API_KEY != '' && env.UNIVERSE_ID != '' && env.PLACE_ID != ''
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          PLACE_ID: ${{ secrets.PLACE_ID }}
        run: |
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            -X POST "https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @TerrorObby150.rbxl)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error al publicar en Open Cloud. Código HTTP: $HTTP_STATUS"
            cat response.txt
            exit 1
          fi
          echo "Publicación exitosa en Roblox Open Cloud."
